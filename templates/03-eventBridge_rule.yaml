AWSTemplateFormatVersion: '2010-09-09'

Parameters:
  SSMDocumentName:
    Type: String
  EventBridgeRoleArn:
    Type: String
  AutoScalingGroupName:
    Type: String

Resources: 
  Myeventbridgerule:
    Type: AWS::Events::Rule
    Properties:
      Description: Events Rule with EcsParameters
      EventPattern:
        source:
          - aws.autoscaling
        detail-type:
          - EC2 Instance-terminate Lifecycle Action
        detail:
          AutoScalingGroupName:
            - !Ref AutoScalingGroupName
      State: ENABLED
      Targets:
        - Arn: !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:automation-definition/${SSMDocumentName}
          Id: TargetSSMAutomation
          RoleArn: !Ref EventBridgeRoleArn

          InputTransformer:
            InputPathsMap:
              instanceId: $.detail.EC2InstanceId
              asgName: $.detail.AutoScalingGroupName
              lifecycleHookName: $.detail.LifecycleHookName

            InputTemplate: !Sub |
              {
                "Parameters": {
                  "InstanceId": ["<instanceId>"],
                  "ASGName": ["<asgName>"],
                  "LifecycleHookName": ["<lifecycleHookName>"],
                  "AutomationAssumeRole": ["arn:aws:iam::${AWS::AccountId}:role/SSMAutomationRole"]
                }
              }