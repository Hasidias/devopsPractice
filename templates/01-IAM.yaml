AWSTemplateFormatVersion: '2010-09-09'

Resources:
  EventBridgeRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: EventBridgeInvokeSSMRole
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: AllowStartSSMAutomation
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ssm:StartAutomationExecution
                Resource: 
                  - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:automation-definition/*
                  - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:automation-execution/*

              - Effect: Allow
                Action:
                  - iam:PassRole
                Resource: !Sub arn:aws:iam::${AWS::AccountId}:role/SSMAutomationRole


  SSMAutomationRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: SSMAutomationRole
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ssm.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: AllowAutomationActions
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ec2:CreateImage
                  - ssm:SendCommand
                  - autoscaling:CompleteLifecycleAction
                Resource: "*"

Outputs:
  EventBridgeRoleArn:
    Value: !GetAtt EventBridgeRole.Arn

  SSMAutomationRoleArn:
    Value: !GetAtt SSMAutomationRole.Arn